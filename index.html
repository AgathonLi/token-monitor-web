<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Token Monitor Web</title>
  <style>
    :root {
      --bg: #eef0f3;
      --ink: #1c1f24;
      --muted: #8b919a;
      --faint: #a8adb4;
      --line: #e1e4e8;
      --pill: #ffffff;
      --pill-on: #dfe3e8;
      --track: #e4e7eb;
      --blue: #6ea8f0;
      --blue-deep: #4d8ee6;
      --live: #3b82f6;
      --card: #f4f5f7;
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --num: "Segoe UI", "DIN Alternate", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .shell {
      width: 100%;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
      padding: 12px 16px 6px;
    }
    .brand { display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 500; }
    .brand-name { font-size: 14px; font-weight: 600; }
    .top-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .tabs {
      display: flex; align-items: center; gap: 2px; flex: 1 1 100%;
      min-width: 0; overflow-x: auto;
    }
    .tabs button {
      border: 0; background: transparent; color: var(--muted);
      font-size: 14px; padding: 8px 11px; border-radius: 8px; min-height: 36px;
      white-space: nowrap;
    }
    .tabs button.on { background: #e8f0fe; color: #1a4fbf; font-weight: 650; }
    .lang-btn, .gear-top {
      height: 36px; border: 0; background: #fff; border-radius: 8px;
      box-shadow: 0 0 0 1px rgb(0 0 0 / 6%);
      color: #5b616a; font-size: 12px; font-weight: 650;
    }
    .lang-btn { padding: 0 10px; min-width: 40px; }
    .gear-top { width: 36px; display: grid; place-items: center; font-size: 16px; }
    .dock, .menu { display: none !important; }
    .home-kpis { display: none; }
    .home-kpis .asof { padding: 10px 0 0; }
    .gate-card .lang-btn { float: right; margin: 0 0 8px; }
    .home-kpis .big {
      margin: 8px 0 0; font-size: clamp(34px, 8vw, 48px); font-weight: 650;
      letter-spacing: -0.04em; line-height: 1.05; font-family: var(--num);
    }
    .home-kpis .cost { margin: 6px 0 0; color: var(--muted); font-size: 18px; font-weight: 500; }
    .list-wrap, .limits-grid { min-width: 0; }
    .asof { font-size: 12px; color: var(--muted); padding: 0 16px 4px; }
    .sort { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 10px; }
    .sort button {
      border: 0; background: #fff; color: var(--muted); border-radius: 8px;
      box-shadow: 0 0 0 1px rgb(0 0 0 / 6%);
      font-size: 12px; padding: 6px 10px; min-height: 32px;
    }
    .sort button.on { background: #e8f0fe; color: #1a4fbf; font-weight: 650; }

    @media (min-width: 860px) {
      .shell { width: min(1120px, 100%); }
      .top { padding: 18px 28px 8px; flex-wrap: nowrap; }
      .tabs { flex: 1 1 auto; overflow: visible; }
      .hero { padding: 8px 28px 4px; }
      .hero .big { font-size: clamp(36px, 3.2vw, 48px); }
      .banner, .asof { padding-left: 28px; padding-right: 28px; }
      .scroll { padding: 8px 28px 36px; }
      .gate { padding: 48px 28px; }
      .gate-card { max-width: 400px; }
      #app.view-home .hero, #app.view-home .asof-hero { display: none; }
      .home-kpis { display: block; }
      .home-grid {
        display: grid;
        grid-template-columns: minmax(240px, 320px) 1fr;
        grid-template-areas:
          "kpis heat"
          "limits models";
        gap: 8px 40px;
        align-items: start;
      }
      .home-kpis { grid-area: kpis; padding-top: 8px; }
      .home-heat { grid-area: heat; margin-top: 0; }
      .home-limits { grid-area: limits; }
      .home-models { grid-area: models; }
      .heat-grid {
        grid-template-rows: repeat(7, 11px);
        grid-auto-columns: 11px;
        gap: 4px;
        justify-content: start;
      }
      .limits-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 40px;
      }
      .list-wrap { max-width: 760px; }
      .tiles { grid-template-columns: repeat(4, 1fr); }
    }

    .gate { flex: 1; display: grid; place-items: center; padding: 28px 22px; }
    .gate-card { width: 100%; }
    .gate-card h1 { margin: 0 0 6px; font-size: 20px; }
    .gate-card p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; border: 0; background: #fff; border-radius: 12px;
      padding: 12px 14px; margin-bottom: 12px; outline: none;
    }
    .err { color: #c4543a; font-size: 13px; min-height: 1.2em; margin: 0 0 10px; }
    .btn {
      border: 0; background: var(--ink); color: #fff; border-radius: 12px;
      padding: 12px 16px; font-weight: 600; min-height: 44px; width: 100%;
    }
    .hint { font-size: 12px; color: var(--faint); margin: -4px 0 14px; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
    .dot.on { background: var(--live); }
    .dot.bad { background: #c4543a; }
    .seg {
      display: flex; background: var(--pill); border-radius: 999px; padding: 3px;
      box-shadow: 0 0 0 1px rgb(0 0 0 / 4%);
    }
    .seg button {
      border: 0; background: transparent; color: var(--muted);
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
      padding: 6px 11px; border-radius: 999px; min-height: 28px;
    }
    .seg button.on { background: var(--pill-on); color: var(--ink); }

    .hero { padding: 10px 22px 6px; }
    .k {
      font-size: 11px; letter-spacing: 0.14em; color: var(--muted);
      font-weight: 600;
    }
    .hero .big {
      margin: 8px 0 0; font-size: clamp(34px, 9vw, 42px); font-weight: 650;
      letter-spacing: -0.04em; line-height: 1.05; font-family: var(--num);
    }
    .hero .cost { margin: 6px 0 0; color: var(--muted); font-size: 18px; font-weight: 500; }

    .scroll { flex: 1; overflow: auto; padding: 4px 16px 24px; }
    .sec { margin-top: 18px; }
    .sec-h {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13px; font-weight: 650; margin: 0 0 10px; color: #3a3f46;
    }
    .sec-h span { color: var(--muted); font-weight: 500; font-size: 12px; }

    .prov { padding: 12px 0 14px; border-bottom: 1px solid var(--line); }
    .prov:last-child { border-bottom: 0; }
    .prov-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .prov-name { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }
    .plan { color: var(--muted); font-size: 13px; font-weight: 500; }
    .sub { color: var(--muted); font-size: 12px; margin: 3px 0 10px 26px; }
    .wins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .wins.one { grid-template-columns: 1fr; }
    .win .lab { display: flex; justify-content: space-between; font-size: 12px; color: #5b616a; margin-bottom: 6px; }
    .bar { height: 7px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 99px; width: 0; }
    .reset { font-size: 11px; color: var(--faint); margin-top: 5px; }

    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 0; border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
    .row .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
    .row .vals { text-align: right; }
    .row .tok { font-size: 13px; font-weight: 650; }
    .row .cst { font-size: 12px; color: var(--muted); }
    .row .pct { width: 36px; text-align: right; font-size: 12px; color: var(--muted); }
    .row-bar { height: 6px; background: var(--track); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .row-bar > i { display: block; height: 100%; border-radius: 99px; }

    .heat { margin-top: 4px; }
    .heat-grid { display: grid; grid-template-rows: repeat(7, 9px); grid-auto-flow: column; grid-auto-columns: 9px; gap: 3px; justify-content: end; }
    .heat-grid b { width: 9px; height: 9px; border-radius: 2px; background: #e3e6ea; display: block; }
    .heat-grid b.i1 { background: #c5daf7; }
    .heat-grid b.i2 { background: #9dc2f3; }
    .heat-grid b.i3 { background: #6ea8f0; }
    .heat-grid b.i4 { background: #4d8ee6; }
    .heat-months { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; margin-top: 8px; }
    .heat-peak { text-align: right; color: var(--muted); font-size: 12px; margin-top: 4px; }

    .chart {
      background: #e7eaee; border-radius: 16px; height: 210px; padding: 16px 12px 8px;
      display: flex; align-items: flex-end; gap: 4px;
    }
    .chart span {
      flex: 1; background: #b7d4f7; border-radius: 3px 3px 0 0; min-height: 2px;
    }
    .chart span.on { background: var(--blue-deep); }
    .chart-x { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; margin-top: 8px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .tile {
      background: #e7eaee; border-radius: 14px; padding: 14px 14px 12px;
    }
    .tile .v { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .tile .l { margin-top: 4px; font-size: 12px; color: var(--muted); }

    .ico {
      width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
      font-size: 11px; font-weight: 800; color: #fff; flex: 0 0 18px;
    }

    .dock {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .dock > * { pointer-events: auto; }
    .picker, .gear {
      background: #fff; border: 0; border-radius: 14px;
      box-shadow: 0 8px 24px rgb(20 24 30 / 12%);
      min-height: 44px;
    }
    .picker {
      display: flex; align-items: stretch; overflow: hidden; padding: 0;
    }
    .picker .cur {
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px; font-weight: 650; font-size: 14px; border: 0; background: transparent;
      min-height: 44px;
    }
    .picker .chev {
      border: 0; background: #f3f4f6; padding: 0 12px; color: var(--muted); min-height: 44px;
    }
    .gear { width: 44px; height: 44px; display: grid; place-items: center; font-size: 18px; color: #5b616a; }
    .menu {
      position: absolute; left: 16px; bottom: 70px;
      background: #fff; border-radius: 16px; padding: 8px;
      box-shadow: 0 16px 40px rgb(20 24 30 / 18%);
      min-width: 168px; z-index: 5;
    }
    .menu button {
      display: flex; align-items: center; gap: 10px; width: 100%;
      border: 0; background: transparent; text-align: left;
      padding: 10px 12px; border-radius: 10px; font-size: 15px; min-height: 42px;
    }
    .menu button.on { background: #e8f0fe; color: #1a4fbf; font-weight: 650; }

    dialog {
      border: 0; border-radius: 18px; padding: 22px; width: min(400px, calc(100vw - 32px));
      background: var(--bg); color: var(--ink);
    }
    dialog::backdrop { background: rgb(20 24 30 / 0.35); }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions .btn { width: auto; flex: 1; }
    .ghost { background: #fff; color: var(--ink); }
    .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
    .banner { color: #c4543a; font-size: 12px; padding: 0 16px 8px; }
  </style>
</head>
<body>
  <div class="shell">
    <div id="gate" class="gate" hidden>
      <form class="gate-card" id="gate-form">
        <button class="lang-btn" type="button" id="btn-lang-gate">EN</button>
        <h1 id="gate-title">连接 Hub</h1>
        <p id="gate-lead">独立网页客户端，不是官方应用。与桌面端同一把密钥，只存在这台浏览器里。</p>
        <div class="err" id="gate-err"></div>
        <label for="hub" id="lab-hub">Hub URL</label>
        <input id="hub" type="text" required placeholder="https://token-monitor-hub.xxx.workers.dev" inputmode="url">
        <label for="secret" id="lab-secret">TOKEN_MONITOR_SECRET</label>
        <input id="secret" type="password" required autocomplete="off">
        <p class="hint" id="gate-hint">不要加 /api/stats。</p>
        <button class="btn" type="submit" id="btn-connect">连接</button>
      </form>
    </div>

    <div id="app" hidden style="display:flex;flex-direction:column;min-height:100%;flex:1;">
      <header class="top">
        <div class="brand">Σ <i class="dot" id="live"></i><span class="brand-name">Token Monitor Web</span></div>
        <nav class="tabs" id="tabs"></nav>
        <div class="top-right">
          <div class="seg" id="seg">
            <button type="button" data-p="today">DAY</button>
            <button type="button" data-p="month" class="on">MONTH</button>
            <button type="button" data-p="allTime">TOTAL</button>
          </div>
          <button class="lang-btn" type="button" id="btn-lang" title="Language">EN</button>
          <button class="gear-top" type="button" id="btn-settings-top" title="设置">⚙</button>
        </div>
      </header>
      <div class="hero">
        <div class="k">TOTAL TOKENS</div>
        <div class="big" id="hero-n">—</div>
        <div class="cost" id="hero-c">—</div>
      </div>
      <div class="asof asof-hero" id="asof"></div>
      <div class="banner" id="banner"></div>
      <div class="scroll" id="main"></div>
      <div class="dock">
        <div class="picker">
          <button class="cur" type="button" id="btn-view"></button>
          <button class="chev" type="button" id="btn-menu">▾</button>
        </div>
        <button class="gear" type="button" id="btn-settings" title="设置">⚙</button>
      </div>
      <div class="menu" id="menu" hidden></div>
    </div>
  </div>

  <dialog id="dlg">
    <form id="dlg-form">
      <h1 id="dlg-title" style="margin:0 0 14px;font-size:18px;">设置</h1>
      <div class="err" id="dlg-err"></div>
      <label for="d-hub" id="lab-d-hub">Hub URL</label>
      <input id="d-hub" type="text" required inputmode="url">
      <label for="d-secret" id="lab-d-secret">密钥</label>
      <input id="d-secret" type="password" required autocomplete="off">
      <div class="actions">
        <button class="btn ghost" type="button" id="btn-forget">清除</button>
        <button class="btn" type="submit" id="btn-save">保存</button>
      </div>
    </form>
  </dialog>

<script>

function t(key, vars) {
  let s = (I18N[state.lang] && I18N[state.lang][key]) || I18N.zh[key] || key;
  if (vars) Object.keys(vars).forEach((k) => { s = s.split("{" + k + "}").join(String(vars[k])); });
  return s;
}
const VIEW_DEFS = [
  { id: "home", icon: "⌂", key: "view.home" },
  { id: "tools", icon: "☰", key: "view.tools" },
  { id: "limits", icon: "◔", key: "view.limits" },
  { id: "models", icon: "✣", key: "view.models" },

  { id: "trends", icon: "↗", key: "view.trends" }
];
function views() { return VIEW_DEFS.map((v) => ({ id: v.id, icon: v.icon, label: t(v.key) })); }
const META = {
  codex: { name: "Codex", color: "#4aa3ad", mark: "∞" },
  claude: { name: "Claude", color: "#c17a62", mark: "✶" },

function relReset(iso) {
  if (!iso) return "";
  const s = Math.round((new Date(iso).getTime() - Date.now()) / 1000);
  const abs = Math.abs(s);
  const d = Math.floor(abs / 86400);
  const h = Math.floor((abs % 86400) / 3600);
  const m = Math.floor((abs % 3600) / 60);
  if (d > 0) return `Reset ${d}d ${h}h`;
  if (h > 0) return `Reset ${h}h ${m}m`;
  return `Reset ${m}m`;
}
function relAgo(iso) {
  if (!iso) return "";

  if (s < 45) return t("justNow");
  if (s < 3600) return t("ago.m", { n: Math.round(s / 60) });
  if (s < 86400) return t("ago.h", { n: Math.round(s / 3600) });
  return t("ago.d", { n: Math.round(s / 86400) });
}
function fmtDur(ms) {

function authLabel(p) {

  if (map[s]) return map[s];

  if (/web/.test(s)) return "Web";

}

function fmtMoney(amount, currency) {
  const n = Number(amount);
  if (!Number.isFinite(n)) return "";
  const cur = String(currency || "").toUpperCase();
  if (!cur || cur === "USD") return fmtCost(n);
  if (cur === "CNY" || cur === "RMB") return "¥" + n.toFixed(2);
  if (cur === "HKD") return "HK$" + n.toFixed(2);
  if (cur === "TWD") return "NT$" + n.toFixed(2);
  if (cur === "CREDITS") return n.toFixed(2) + " cr";

}
function isMoneyWindow(w) {

function limitLeft(p) {

}
function sortLimits(list) {

    if (key === "sync") return cmp(new Date(a.receivedAt || a.updatedAt || 0).getTime(), new Date(b.receivedAt || b.updatedAt || 0).getTime(), dir);
    if (key === "cost") return cmp(Number(pa.costUsd) || 0, Number(pb.costUsd) || 0, dir);
    return cmp(Number(pa.totalTokens) || 0, Number(pb.totalTokens) || 0, dir);

}
function statsStamp() {

function civilYmd(date) {

  } catch {

}

}

function heatmapHtml() {
  const days = dailyList();
  const by = new Map(days.map((d) => [String(d.date).slice(0, 10), Number(d.tokens) || 0]));
  const today = civilYmd();
  const weeks = isWide() ? 46 : 26;
  let start = addCivilDays(today, -(weeks * 7 - 1));
  start = addCivilDays(start, -weekdaySun0(start));
  const vals = [];
  let max = 1;
  for (let cur = start; cur <= today; cur = addCivilDays(cur, 1)) {
    const v = by.get(cur) || 0;
    vals.push({ key: cur, v });
    if (v > max) max = v;
  }
  const months = [];
  const seen = new Set();
  for (const x of vals) {
    const m = Number(x.key.slice(5, 7));
    if (!seen.has(m) && x.key.slice(8, 10) <= "07") {
      seen.add(m);
      months.push(state.lang === "zh" ? (m + "月") : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1]);
    }
  }
  const html = vals.map((x) => {
    let i = 0;
    if (x.v > 0) i = x.v / max >= 0.75 ? 4 : x.v / max >= 0.5 ? 3 : x.v / max >= 0.25 ? 2 : 1;
    return `<b class="i${i}"></b>`;
  }).join("");
  const peak = days.reduce((m, d) => Math.max(m, Number(d.tokens) || 0), 0);
  return `<div class="heat">
    <div class="heat-grid">${html}</div>
    <div class="heat-months">${months.slice(isWide() ? -8 : -4).map(esc).join("&nbsp;&nbsp;&nbsp;&nbsp;") || ""}</div>
    <div class="heat-peak">${esc(t("peak"))} ${fmtCompact(peak)}</div>
  </div>`;
}

function streakAndTime() {
  const days = dailyList();
  const active = new Set(days.filter((d) => Number(d.tokens) > 0).map((d) => String(d.date).slice(0, 10)));
  let streak = 0;
  for (let key = civilYmd(); active.has(key); key = addCivilDays(key, -1)) streak += 1;
  const activeDays = active.size;
  const peak = days.reduce((m, d) => Math.max(m, Number(d.tokens) || 0), 0);
  const ms = days.reduce((s, d) => s + (Number(d.activeTimeMs) || 0), 0);
  const sum = (state.history && state.history.summary) || (state.stats && state.stats.historyPreview && state.stats.historyPreview.summary) || {};
  return {
    activeDays: sum.activeDays || activeDays,
    streak: sum.currentStreak || streak,
    peak: sum.peakTokens || peak,
    ms: sum.totalActiveTimeMs || ms
  };
}

function monthBars() {
  const days = dailyList();
  const today = civilYmd();
  const ym = today.slice(0, 7);
  let rows = days.filter((d) => String(d.date).startsWith(ym));
  if (rows.length < 8) rows = days.slice(-24);
  const max = Math.max(...rows.map((d) => Number(d.tokens) || 0), 1);
  const bars = rows.map((d) => {
    const h = Math.max(2, Math.round((Number(d.tokens) / max) * 170));
    const on = String(d.date).slice(0, 10) === today ? "on" : "";
    return `<span class="${on}" style="height:${h}px"></span>`;
  }).join("");
  const first = rows[0] ? String(rows[0].date).slice(5).replace("-", "/") : "";
  const last = rows[rows.length - 1] ? String(rows[rows.length - 1].date).slice(5).replace("-", "/") : "";
  return { bars, first, last };
}

        ${ico(x.id)}
        <div class="nm">${esc(x.id)}</div>
        <div class="tok">${fmtCompact(x.tokens)}</div>
        <div class="pct">${Math.round(x.pct * 100)}%</div>
      </div>`).join("") || `<p class="empty">${esc(t("empty.models"))}</p>`;
  return `<div class="home-grid">
    <div class="home-kpis">
      <div class="k">TOTAL TOKENS</div>
      <div class="big">${fmtFull(p.totalTokens)}</div>
      <div class="cost">${fmtCost(p.costUsd)}</div>
      <div class="asof">${esc(asofText())}</div>
    </div>
    <div class="sec home-limits"><div class="sec-h">${esc(t("sec.limits"))} <span>◔</span></div>${renderLimits(false)}</div>
    <div class="sec home-models"><div class="sec-h">${esc(t("sec.models"))} <span>✣</span></div>${sortBar("models", ["tokens", "cost", "name"])}${modelRows}</div>
    <div class="sec home-heat"><div class="sec-h">${esc(t("sec.activity"))} <span>${esc(t("activeDays", { n: tstat.activeDays }))} ↗</span></div>${heatmapHtml()}</div>
  </div>`;
}

function applyStaticLang() {
  document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
  const set = (id, text) => { const el = $(id); if (el) el.textContent = text; };
  set("gate-title", t("gate.title"));
  set("gate-lead", t("gate.lead"));
  set("lab-hub", t("gate.hub"));
  set("lab-secret", t("gate.secret"));
  set("gate-hint", t("gate.hint"));
  set("btn-connect", t("gate.connect"));
  set("dlg-title", t("settings"));
  set("lab-d-hub", t("gate.hub"));
  set("lab-d-secret", t("secret"));
  set("btn-forget", t("clear"));
  set("btn-save", t("save"));
  const next = state.lang === "zh" ? "EN" : "中";
  set("btn-lang", next);
  set("btn-lang-gate", next);
  const gear = $("btn-settings-top");
  if (gear) gear.title = t("settings");
}
function paint() {
  applyStaticLang();
  $("app").classList.toggle("view-home", state.view === "home");
  if (!state.stats) {
    $("hero-n").textContent = "—";
    $("hero-c").textContent = "—";
    $("asof").textContent = "";
    $("main").innerHTML = `<p class="empty">${esc(state.error || t("empty.wait"))}</p>`;
  } else {
    const p = periodOf(state.stats, state.period);
    $("hero-n").textContent = fmtFull(p.totalTokens);
    $("hero-c").textContent = fmtCost(p.costUsd);
    $("asof").textContent = asofText();
    $("main").innerHTML = renderMain();
    $("banner").textContent = state.error || "";
  }
  const vlist = views();
  const v = vlist.find((x) => x.id === state.view) || vlist[0];
  $("btn-view").innerHTML = `${v.icon}　${v.label}`;
  $("menu").innerHTML = vlist.map((x) =>
    `<button type="button" data-v="${x.id}" class="${x.id === state.view ? "on" : ""}">${x.icon}　${x.label}</button>`
  ).join("");
  $("tabs").innerHTML = vlist.map((x) =>
    `<button type="button" data-v="${x.id}" class="${x.id === state.view ? "on" : ""}">${esc(x.label)}</button>`
  ).join("");
  for (const b of $("seg").querySelectorAll("button")) b.classList.toggle("on", b.dataset.p === state.period);
  $("live").className = "dot " + (state.error ? "bad" : state.stats ? "on" : "");
}

async function api(path) {
  const hub = String(state.cfg.hub || "").replace(/\/+$/, "");
  const res = await fetch(hub + path, {
    headers: { authorization: "Bearer " + state.cfg.secret },
    cache: "no-store"
  });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch { /* ignore */ }
  if (res.status === 401) throw new Error(t("err.unauthorized"));
  if (res.status === 503) throw new Error(t("err.secretRequired"));
  if (!res.ok) throw new Error((data && (data.error || data.message)) || ("HTTP " + res.status));
  return data;
}

async function pull() {
  if (!state.cfg) return false;
  try {
    const stats = await api("/api/stats");
    if (!stats || !stats.periods) throw new Error(t("err.notStats"));
    state.stats = stats;
    try { state.history = await api("/api/history"); }
    catch { state.history = stats.historyPreview || null; }
    state.error = "";
    paint();
    return true;
  } catch (e) {
    let msg = e.message || String(e);
    if (/failed to fetch|networkerror|load failed/i.test(msg)) {
      msg = t("err.fetch");
    }
    state.error = msg;
    paint();
    return false;
  }
}

function showGate(err) {
  $("app").hidden = true;
  $("gate").hidden = false;
  applyStaticLang();
  $("gate-err").textContent = err || "";
  const cfg = loadCfg() || {};
  $("hub").value = cfg.hub || "";
  $("secret").value = cfg.secret || "";
}
function showApp() {
  $("gate").hidden = true;
  $("app").hidden = false;
  paint();
  if (state.timer) clearInterval(state.timer);
  state.timer = setInterval(pull, 60000);
}

async function connectFromForm(hubRaw, secret) {
  const hub = normalizeHub(hubRaw);
  if (!/^https?:\/\//i.test(hub)) throw new Error(t("err.hub"));
  if (!secret) throw new Error(t("err.secret"));
  state.cfg = { hub, secret };
  saveCfg(state.cfg);
  const ok = await pull();
  if (!ok) throw new Error(state.error || t("err.connect"));
  showApp();
}

$("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("gate-err").textContent = t("gate.connecting");
  $("btn-connect").disabled = true;
  try { await connectFromForm($("hub").value, $("secret").value); $("gate-err").textContent = ""; }
  catch (err) { $("gate-err").textContent = err.message || String(err); }
  finally { $("btn-connect").disabled = false; }
});
$("seg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]");
  if (!b) return;
  state.period = b.dataset.p;
  paint();
});
function toggleMenu() {
  $("menu").hidden = !$("menu").hidden;
}
$("btn-view").addEventListener("click", toggleMenu);
$("btn-menu").addEventListener("click", toggleMenu);
$("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  state.view = b.dataset.v;
  $("menu").hidden = true;
  paint();
});
document.addEventListener("click", (e) => {
  if (!$("menu").hidden && !e.target.closest(".picker") && !e.target.closest("#menu")) $("menu").hidden = true;
});
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  state.view = b.dataset.v;
  $("menu").hidden = true;
  paint();
});
$("main").addEventListener("click", (e) => {
  const b = e.target.closest(".sort button[data-k]");
  if (!b) return;
  const box = b.closest(".sort");
  if (!box) return;
  const view = box.dataset.sort;
  const key = b.dataset.k;
  const cur = sortSpec(view);
  if (cur.key === key) cur.dir = cur.dir === "desc" ? "asc" : "desc";
  else { cur.key = key; cur.dir = (key === "name" || key === "left") ? "asc" : "desc"; }
  state.sort[view] = { key: cur.key, dir: cur.dir };
  paint();
});
function toggleLang() {
  state.lang = state.lang === "zh" ? "en" : "zh";
  localStorage.setItem(LANG_KEY, state.lang);
  if (!$("app").hidden) paint();
  else applyStaticLang();
}
$("btn-lang").addEventListener("click", toggleLang);
$("btn-lang-gate").addEventListener("click", toggleLang);
function openSettings() {
  const cfg = state.cfg || loadCfg() || {};
  $("d-hub").value = cfg.hub || "";
  $("d-secret").value = cfg.secret || "";
  $("dlg-err").textContent = "";
  $("dlg").showModal();
}
$("btn-settings").addEventListener("click", openSettings);
$("btn-settings-top").addEventListener("click", openSettings);
$("dlg-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await connectFromForm($("d-hub").value, $("d-secret").value);
    $("dlg").close();
  } catch (err) { $("dlg-err").textContent = err.message || String(err); }
});
$("btn-forget").addEventListener("click", () => {
  localStorage.removeItem(KEY);
  $("dlg").close();
  state.cfg = null; state.stats = null;
  if (state.timer) clearInterval(state.timer);
  showGate();
});

(function boot() {
  state.lang = loadLang();
  applyStaticLang();
  const onWide = () => { if (!$("app").hidden) paint(); };
  if (WIDE_MQ.addEventListener) WIDE_MQ.addEventListener("change", onWide);
  else WIDE_MQ.addListener(onWide);
  const cfg = loadCfg();
  if (!cfg || !cfg.hub || !cfg.secret) { showGate(); return; }
  state.cfg = cfg;
  showApp();
  pull();
})();
</script>
</body>
</html>
